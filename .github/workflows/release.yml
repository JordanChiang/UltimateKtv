name: Release

# 推送版本號 tag (例如 2.0.5) 時，自動發佈 x64 + x86 到 GitHub Release。
#   Phase 1：發佈主程式 (x64/x86) + Updater + StyleSimulator，打包元件 zip + update.json。
#   Phase 2：抓 SongMgr (JordanChiang/SongMgr) 最新 release 的 App 包併入 (Codec_x86/Tools 共用本體的)。
#   Phase 3：把 exe 送 VirusTotal，結果寫在 run Summary 並存到 vt-reports 分支，Release notes 附上分支上報告的連結 (需 VT_API_KEY secret；失敗不中斷發佈)。
# 手動觸發可勾 dry_run 試跑：照常 build/打包，並照樣跑 VirusTotal，但不建立或更動任何 Release；
# VT 結果改寫進該 run 的 Summary 頁、附檔上傳為 workflow artifact (用來確認新 code commit 的 VT 掃描與產出)。
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: '要發佈的版本號 tag (例如 2.0.5)'
        required: true
      dry_run:
        description: '試跑：build/打包 + VirusTotal (結果寫在 run Summary)，但不建立或更動 Release；附檔上傳為 artifact'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: 決定 tag
        id: ver
        shell: pwsh
        run: |
          $tag = if ('${{ github.event_name }}' -eq 'workflow_dispatch') { '${{ github.event.inputs.tag }}' } else { '${{ github.ref_name }}' }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "發佈 tag: $tag"

      # libmpv-2.dll 不在 repo (超過 GitHub 單檔上限)。csproj 的 FetchLibmpv 是 ContinueOnError，
      # 且在 dotnet publish 下，它「下載後動態加入的 Content」不保證會被帶進 publish。
      # 因此在發佈前明確下載到 Codec\ / Codec_x86\：檔案先在磁碟上，publish 的靜態 Content glob
      # 就會帶上它；下載失敗也在這一步大聲報錯 (x86 鎖 20260412，版本/雜湊由 Get-Libmpv.ps1 固定)。
      - name: 下載 libmpv
        shell: pwsh
        run: |
          ./Tools/Get-Libmpv.ps1 -Arch x64 -CodecDir Codec
          ./Tools/Get-Libmpv.ps1 -Arch x86 -CodecDir Codec_x86
          if (-not (Test-Path Codec/libmpv-2.dll))     { throw 'x64 libmpv 下載失敗 (見上方 Get-Libmpv 警告)' }
          if (-not (Test-Path Codec_x86/libmpv-2.dll)) { throw 'x86 libmpv 下載失敗 (見上方 Get-Libmpv 警告)' }
          Write-Host ("libmpv 就緒: x64={0:N0} bytes, x86={1:N0} bytes" -f (Get-Item Codec/libmpv-2.dll).Length, (Get-Item Codec_x86/libmpv-2.dll).Length)

      # 發佈佈局與本機「VS 發佈」一致：x64 / x86 主程式 + Updater + StyleSimulator 都進同一個 publish\。
      # 各專案的 FolderProfile.pubxml 已把 PublishDir 指向 publish\，x86 另外覆寫 Platform / RID。
      - name: 發佈主程式 x64
        shell: pwsh
        run: dotnet publish UltimateKtv.csproj -p:PublishProfile=FolderProfile --nologo -v minimal

      # x86 關閉 ReadyToRun：x86 的 R2R 內嵌原生碼會觸發 BitDefender 系列的通用啟發式
      # (Gen:Variant.Adware.Yogi，連帶 ALYac/Arcabit/Emsisoft/GData/eScan/VIPRE/CTX 共 8 家誤判)。
      # 實測關掉後這 8 家全部 undetected；單檔發佈故不影響檔案佈局、只是 exe 小約 8MB、冷啟動略慢。x64 不受影響。
      - name: 發佈主程式 x86
        shell: pwsh
        run: dotnet publish UltimateKtv.csproj -p:PublishProfile=FolderProfile -p:Platform=x86 -p:RuntimeIdentifier=win-x86 -p:PublishReadyToRun=false --nologo -v minimal

      - name: 發佈 Updater (net471 x86)
        shell: pwsh
        run: dotnet publish Updater/UltimateKtv.Updater.csproj -p:PublishProfile=FolderProfile --nologo -v minimal

      - name: 發佈 StyleSimulator
        shell: pwsh
        run: dotnet publish StyleSimulator/UltimateKtv.StyleSimulator.csproj -p:PublishProfile=FolderProfile --nologo -v minimal

      # Phase 2：SongMgr 以獨立 repo 的「最新 release」併入 (不在 CI 建置原始碼)。
      # 只取 App 包 (CrazyKTV_SongMgr.exe + SongMgr\)；Codec_x86\ / Tools\ 共用本體發佈的版本。
      - name: 併入 SongMgr 最新 release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tmp = New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\songmgr"
          gh release download --repo JordanChiang/SongMgr --pattern 'SongMgr_App_*.zip' --dir $tmp.FullName
          $zip = Get-ChildItem $tmp.FullName -Filter 'SongMgr_App_*.zip' | Select-Object -First 1
          if (-not $zip) { throw 'SongMgr App 包下載失敗' }
          Expand-Archive -Path $zip.FullName -DestinationPath publish -Force
          Write-Host "已併入 SongMgr: $($zip.Name)"

      # FetchLibmpv 是 ContinueOnError，下載失敗不會讓 build 失敗，必須在這裡把關，
      # 否則會發出一個缺 libmpv、無法播放的 release。
      - name: 驗證發佈產出完整
        shell: pwsh
        run: |
          $need = @(
            'publish/UltimateKtv.exe',
            'publish/UltimateKtv_x86.exe',
            'publish/UltimateKtv.Updater.exe',
            'publish/Codec/libmpv-2.dll',
            'publish/Codec_x86/libmpv-2.dll',
            'publish/runtimes/win-x64/native/e_sqlite3.dll',
            'publish/runtimes/win-x86/native/e_sqlite3.dll',
            'publish/libs/win-x64/MaterialDesignThemes.Wpf.dll',
            'publish/libs/win-x86/MaterialDesignThemes.Wpf.dll',
            'publish/Tools/yt-dlp.exe',
            'publish/Tools/yt-dlp_x86.exe',
            'publish/Tools/ffmpeg.exe',
            'publish/CrazyKTV_SongMgr.exe',
            'publish/SongMgr/CrazySongMgr.mdb'
          )
          $missing = $need | Where-Object { -not (Test-Path $_) }
          if ($missing) { throw "發佈產出缺檔:`n$($missing -join "`n")" }
          Write-Host "發佈產出檢查通過。"

      - name: 打包 Release 附檔 (元件 zip + update.json)
        shell: pwsh
        run: ./scripts/pack-release.ps1 -PublishDir publish -Tag ${{ steps.ver.outputs.tag }}

      - name: 建立 GitHub Release 並上傳附檔
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          files: publish/ReleaseAssets/**/*
          fail_on_unmatched_files: true
          generate_release_notes: true

      # Phase 3：exe 送 VirusTotal。結果一律寫進該 run 的 Summary 頁；
      # 正式發佈 (非 dry_run) 時另外存成 vt-reports 分支的 <tag>.md，Release notes 附上它的連結。錯誤 (無 key / 逾時 / 速率限制) 都不中斷。
      # 注意：VT 上傳會讓檔案對 VT 使用者可見；dry_run 掃的是未發佈 build，等於提前公開 (內容與正式發佈幾乎一樣)。
      # HA gate：對照 scripts/vt-baseline.json 白名單，只在某 exe 出現白名單以外的新命中時，
      # 在 Summary 標記「建議送 Hybrid Analysis」並附上本機 scan.sh 指令 (不自動送)。
      - name: VirusTotal 掃描
        continue-on-error: true
        shell: pwsh
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if (-not $env:VT_API_KEY) { Write-Host 'VT: 未設定 VT_API_KEY secret，略過。'; exit 0 }
          $vt = Join-Path $env:RUNNER_TEMP 'vt.md'
          # 送 publish 根目錄所有自家 exe (UltimateKtv(.x86)/Updater/StyleSimulator/CrazyKTV_SongMgr…)；
          # 新增 exe 會自動納入。Tools\ 下的第三方 ffmpeg/yt-dlp 不送 (非自家且部分 >32MB)。
          $exes = Get-ChildItem publish -Filter *.exe -File | Select-Object -ExpandProperty FullName
          Write-Host ("VT 掃描對象: " + (($exes | Split-Path -Leaf) -join ', '))
          # -Baseline 啟用 HA gate (只標記、不自動送)；-FlagsOut 吐出是否有白名單外命中供 log
          $flags = Join-Path $env:RUNNER_TEMP 'vt-flags.json'
          ./scripts/vt-scan.ps1 -Files $exes -OutFile $vt -Baseline scripts/vt-baseline.json -FlagsOut $flags | Out-Null
          if (-not (Test-Path $vt)) { Write-Host 'VT: 無結果，略過。'; exit 0 }
          if (Test-Path $flags) {
            $g = Get-Content -Raw $flags | ConvertFrom-Json
            if ($g.anyFlagged) { Write-Host ('VT gate: 有白名單外命中，建議送 HA -> ' + ($g.flagged -join ', ')) }
            else { Write-Host 'VT gate: 無白名單外命中，不需 HA。' }
          }
          # 一律寫進該 run 的 Summary 頁 (dry_run 時這就是查看掃描結果的地方)
          Get-Content -Raw $vt | Add-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding utf8
          if ('${{ github.event.inputs.dry_run }}' -eq 'true') { Write-Host 'VT: dry_run，結果只寫 Summary、不動 Release。'; exit 0 }
          # 正式發佈：掃描結果存成 vt-reports 分支的 <tag>.md (Actions 的 run/Summary 在公開 repo 最多留 90 天，
          # 分支上的檔案永久保留)，Release notes 只附它的連結。vt-reports 是孤兒分支，不含程式碼、不併回 master。
          $tag = '${{ steps.ver.outputs.tag }}'
          $reportUrl = '${{ github.server_url }}/${{ github.repository }}/blob/vt-reports/' + [uri]::EscapeDataString("$tag.md")
          $wt = Join-Path $env:RUNNER_TEMP 'vt-reports'
          $pushed = $false
          try {
            git fetch --depth=1 origin vt-reports
            if ($LASTEXITCODE -eq 0) {
              git worktree add -B vt-reports $wt FETCH_HEAD
            } else {
              # 第一次：建立孤兒分支
              git worktree add --detach $wt
              git -C $wt checkout --orphan vt-reports
              git -C $wt rm -rf --quiet .
            }
            if ($LASTEXITCODE -ne 0) { throw "建立 vt-reports 工作目錄失敗 (exit $LASTEXITCODE)" }
            ("# $tag`n`n" + (Get-Content -Raw $vt)) | Set-Content -Path (Join-Path $wt "$tag.md") -Encoding utf8NoBOM
            git -C $wt add -- "$tag.md"
            git -C $wt diff --cached --quiet
            if ($LASTEXITCODE -ne 0) {
              git -C $wt -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -q -m "VT report $tag"
              if ($LASTEXITCODE -ne 0) { throw "commit 失敗 (exit $LASTEXITCODE)" }
            }
            git -C $wt push origin vt-reports
            if ($LASTEXITCODE -ne 0) { throw "push 失敗 (exit $LASTEXITCODE)" }
            $pushed = $true
            Write-Host "VT: 報告已存到 vt-reports 分支 -> $reportUrl"
          }
          catch { Write-Warning "VT: 存到 vt-reports 分支失敗 ($($_.Exception.Message))，改把完整結果寫進 release notes。" }
          $section = if ($pushed) { "## VirusTotal 掃描結果`n`n各 exe 的 VirusTotal 掃描結果見 [$tag 的掃描報告]($reportUrl)。`n" } else { Get-Content -Raw $vt }
          $body = gh release view $tag --json body -q .body
          $combined = Join-Path $env:RUNNER_TEMP 'notes.md'
          ($body + "`n`n" + $section) | Set-Content -Path $combined -Encoding utf8
          gh release edit $tag --notes-file $combined
          if ($LASTEXITCODE -ne 0) { throw "更新 release notes 失敗 (exit $LASTEXITCODE)" }
          Write-Host 'VT: 已附加到 release notes。'
          exit 0

      # 試跑 (dry_run)：不動任何 Release，改把打包好的附檔上傳為 workflow artifact 供下載檢查。
      - name: 試跑：上傳附檔為 artifact
        if: ${{ github.event.inputs.dry_run == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: ReleaseAssets-${{ steps.ver.outputs.tag }}
          path: publish/ReleaseAssets/
          if-no-files-found: error
